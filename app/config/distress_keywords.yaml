# Distress/unsafe-signal keyword patterns, per LMS tap_language value.
#
# Regex patterns (case-insensitive), one list per language. Categories per
# source doc rule C: abuse, self-harm, fear, sickness, safety. Extensible —
# add a language key + pattern list; unmapped languages fall back to BOTH
# the "English" and "Hindi" lists combined (see distress_keywords.py's
# get_distress_patterns — never silently degrades to a single list for an
# unmapped language; a warning is logged instead so the gap is visible).
#
# Every language marked supported: true in language_map.yaml has a
# dedicated entry here (Task/CR #TB-3): English, Hindi, Bengali, Tamil,
# Telugu, Marathi, Gujarati, Kannada, Malayalam, Urdu. Punjabi is
# `supported: false` in language_map.yaml (STT-only, TTS falls back to
# Hindi) and intentionally has no dedicated entry — it relies on the
# English+Hindi fallback pair like any other unmapped language.
#
# Native-script entries include common Latin transliteration alongside the
# native script per PRD-003 Task 5's requirement that the detector isn't
# hardcoded English-only. Each language keeps the same 5 categories (abuse,
# self-harm, fear, sickness, safety) as the English/Hindi lists.

English:
  # abuse
  - "\\bhit(ting)?\\s+me\\b"
  - "\\bhurt(ing)?\\s+me\\b"
  - "\\bbeat(ing|s)?\\s+me\\b"
  - "\\babus(e|ing|ed)\\b"
  # self-harm
  - "\\bkill\\s+myself\\b"
  - "\\bhurt\\s+myself\\b"
  - "\\bwant\\s+to\\s+die\\b"
  - "\\bsuicid"
  # fear
  - "\\bafraid\\b"
  - "\\bscared\\b"
  - "\\bterrified\\b"
  - "\\bthreaten"
  # sickness
  - "\\bsick\\b"
  - "\\bvery\\s+ill\\b"
  - "\\bcan'?t\\s+breathe\\b"
  - "\\bfever\\b.*\\bbad\\b"
  # safety
  - "\\bnot\\s+safe\\b"
  - "\\bdon'?t\\s+feel\\s+safe\\b"
  - "\\bdanger\\b"
  - "\\balone\\s+at\\s+home\\b.*\\bscared\\b"

