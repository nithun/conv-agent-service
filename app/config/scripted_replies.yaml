Malayalam:
  greeting_direct: "ഹായ് {child_name}! ഇന്ന് നിനക്ക് എങ്ങനെ തോന്നുന്നു — ഉത്സാഹത്തോടെ, കുഴപ്പമില്ല, അതോ ക്ഷീണിച്ചോ?"
  greeting_candidate_confirm: "സൂപ്പർ, ഹായ് {child_name}! ഇന്ന് നിനക്ക് എങ്ങനെ തോന്നുന്നു?"
  readiness_mode_choice: "കൊള്ളാം. നമുക്ക് ശബ്ദത്തിൽ സംസാരിക്കാം, അല്ലെങ്കിൽ എളുപ്പമെങ്കിൽ നിനക്ക് ടൈപ്പ് ചെയ്യാം. നിനക്ക് എന്താണ് വേണ്ടത്?"
  mode_choice_reask: "നിനക്ക് ശബ്ദത്തിൽ തുടരണോ, അതോ ടൈപ്പ് ചെയ്യണോ?"
  fallback: "ക്ഷമിക്കണം, എനിക്ക് ഇപ്പോൾ അല്പം ബുദ്ധിമുട്ട് ഉണ്ട്. കുറച്ച് കഴിഞ്ഞ് വീണ്ടും ശ്രമിക്കാം."
  distress_close: "എന്നോട് പറഞ്ഞതിന് നന്ദി. നിന്നെ സഹായിക്കാൻ ഞാൻ ഇപ്പോൾ തന്നെ ഒരു മുതിർന്ന ആളെ വിളിക്കുന്നു. ഇന്ന് നീ വളരെ നന്നായി ചെയ്തു."
  clarification: "എനിക്ക് വ്യക്തമായി മനസ്സിലായില്ല. നിനക്ക് ഒരിക്കൽ കൂടി പറയാമോ?"
  asr_fallback: "നമുക്ക് ഇപ്പോൾ ടൈപ്പിംഗിലേക്ക് മാറാം — നിനക്ക് നിന്റെ മറുപടി ടൈപ്പ് ചെയ്ത് അയക്കാം."
  unresolved_doubt_escalation: "ഇന്ന് ഇത് അല്പം ബുദ്ധിമുട്ടാണെന്ന് തോന്നുന്നു. ഇത് ശരിയായി വിശദീകരിക്കാൻ ഞാൻ ഒരു മുതിർന്ന ആളെ വിളിക്കുന്നു. ശ്രമിച്ചതിന് കൊള്ളാം!"
  off_turn_nudge: "മനസ്സിലായി — കുറച്ച് കഴിഞ്ഞ് അതിലേക്ക് തിരിച്ചുവരാം. ഇന്നത്തെ പ്രവർത്തനം നമുക്ക് തുടരാമോ?"
