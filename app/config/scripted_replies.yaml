  unresolved_doubt_escalation: "ਲੱਗਦਾ ਹੈ ਅੱਜ ਇਹ ਥੋੜ੍ਹਾ ਔਖਾ ਹੈ। ਮੈਂ ਇਸਨੂੰ ਠੀਕ ਤਰ੍ਹਾਂ ਸਮਝਾਉਣ ਲਈ ਇੱਕ ਵੱਡੇ ਵਿਅਕਤੀ ਨੂੰ ਬੁਲਾ ਰਿਹਾ ਹਾਂ। ਕੋਸ਼ਿਸ਼ ਕਰਨ ਲਈ ਸ਼ਾਬਾਸ਼!"
  off_turn_nudge: "ਸਮਝ ਗਿਆ — ਆਓ ਥੋੜ੍ਹੀ ਦੇਰ ਬਾਅਦ ਉਸ ਵੱਲ ਵਾਪਸ ਆਈਏ। ਕੀ ਅਸੀਂ ਅੱਜ ਦੀ ਗਤੀਵਿਧੀ ਜਾਰੀ ਰੱਖੀਏ?"
  reset_confirmation: "ਹੋ ਗਿਆ! ਤੇਰੀ ਟੈਸਟ ਤਰੱਕੀ ਸ਼ੁਰੂ ਤੋਂ ਰੀਸੈੱਟ ਕਰ ਦਿੱਤੀ ਗਈ ਹੈ।"
