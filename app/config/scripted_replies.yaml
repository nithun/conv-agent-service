# Scripted (non-LLM) child-facing reply text + mode/language-choice
# matching keywords, per LMS tap_language value (CR-007 GAP 1/2).
#
# Mirrors distress_keywords.yaml/language_map.yaml's config-driven-language
# seam: every language marked `supported: true|false` in language_map.yaml
# (Punjabi included — it's scoped as fine for scripted TEXT even though its
# STT/TTS falls back to English, see language_map.yaml + CR-007) has a
# dedicated block below, covering all 11 language-eligible reply keys
# (`reset_confirmation` added 2026-07-27, CR-011/ADR-013 Task 6) plus
# mode_voice_keywords/mode_text_keywords/language_name_keywords.
#
# Translations are MODEL-AUTHORED for this CR — a native-speaker/TAP-team
# review is a tracked follow-up (F-034), not a precondition (mirrors the
# pre-existing distress_keywords.yaml caveat, F-009).
#
# Fallback contract (app/config/scripted_replies.py::get_scripted_reply):
# a language missing here, OR missing a specific key, falls back to the
# English block's value for THAT key alone — never combines two languages
# into one reply (a scripted reply is one sentence shown to a child;
# concatenating languages would read as garbled, not "extra coverage" —
# deliberate divergence from distress_keywords.yaml's English+Hindi-combined
# fallback).
#
# `{child_name}` is a literal str.format() placeholder — greeting_direct and
# greeting_candidate_confirm are formatted with the resolved child's name at
# the call site (turn_processor.py), exactly like the pre-CR-007 f-strings
# they replace.
#
# The reserved `_language_choice` block (leading underscore = "meta, not a
# language", the same convention language_map.yaml's `_fallback` key already
# establishes) holds the one-time, language-agnostic ask-turn prompt/reask.

English:
  greeting_direct: "Hi {child_name}! How are you feeling today — excited, okay, or tired?"
  greeting_candidate_confirm: "Great, hi {child_name}! How are you feeling today?"
  readiness_mode_choice: "Great. We can talk in voice, or you can type if that feels easier. What would you like?"
  mode_choice_reask: "Would you like to continue in voice, or by typing?"
  fallback: "Sorry, I'm having a little trouble right now. Let's try again in a moment."
  distress_close: "Thank you for telling me. I'm going to get a grown-up to help you with this right now. You did great today."
  clarification: "I didn't catch that clearly. Can you say it once again?"
  asr_fallback: "Let's switch to typing for now — you can type your reply instead."
  unresolved_doubt_escalation: "It looks like this one's tricky today. I'm going to get a grown-up to help explain it properly. You did great trying!"
  off_turn_nudge: "I understand — let's come back to that in a moment. Shall we continue with today's activity?"
  reset_confirmation: "All done! Your test progress has been reset to the very beginning."
  mode_voice_keywords: ["voice"]
  mode_text_keywords: ["text", "type"]
  language_name_keywords: ["english"]

Hindi:
  greeting_direct: "नमस्ते {child_name}! आज तुम कैसा महसूस कर रहे हो — उत्साहित, ठीक, या थके हुए?"
  greeting_candidate_confirm: "बहुत बढ़िया, नमस्ते {child_name}! आज तुम कैसा महसूस कर रहे हो?"
  readiness_mode_choice: "बढ़िया। हम आवाज़ में बात कर सकते हैं, या अगर आसान लगे तो तुम टाइप भी कर सकते हो। तुम्हें क्या पसंद है?"
  mode_choice_reask: "क्या तुम आवाज़ में बात करना चाहोगे, या टाइप करके?"
  fallback: "माफ़ करना, मुझे अभी थोड़ी दिक्कत हो रही है। चलो थोड़ी देर में फिर से कोशिश करते हैं।"
  distress_close: "मुझे बताने के लिए धन्यवाद। मैं अभी एक बड़े व्यक्ति को इसमें तुम्हारी मदद के लिए बुला रहा हूँ। तुमने आज बहुत बढ़िया किया।"
  clarification: "मैं ठीक से समझ नहीं पाया। क्या तुम एक बार फिर से बता सकते हो?"
  asr_fallback: "चलो अभी टाइपिंग पर चलते हैं — तुम अपना जवाब टाइप करके भेज सकते हो।"
  unresolved_doubt_escalation: "लगता है आज यह सवाल थोड़ा मुश्किल है। मैं एक बड़े व्यक्ति को इसे ठीक से समझाने के लिए बुला रहा हूँ। कोशिश करने के लिए शाबाश!"
  off_turn_nudge: "समझ गया — चलो थोड़ी देर में उस पर वापस आते हैं। क्या हम आज की गतिविधि जारी रखें?"
  reset_confirmation: "हो गया! तुम्हारी टेस्ट प्रगति शुरू से रीसेट कर दी गई है।"
  mode_voice_keywords: ["आवाज़", "आवाज", "awaaz", "बोलकर", "बोलो"]
  mode_text_keywords: ["टाइप", "type", "likh", "लिख", "टाइप करके"]
  language_name_keywords: ["hindi", "हिंदी", "हिन्दी"]

Bengali:
  greeting_direct: "হ্যালো {child_name}! আজ তোমার কেমন লাগছে — উত্তেজিত, ঠিক আছে, নাকি ক্লান্ত?"
  greeting_candidate_confirm: "দারুণ, হ্যালো {child_name}! আজ তোমার কেমন লাগছে?"
  readiness_mode_choice: "দারুণ। আমরা ভয়েসে কথা বলতে পারি, অথবা সহজ মনে হলে তুমি টাইপও করতে পারো। তুমি কী চাও?"
  mode_choice_reask: "তুমি কি ভয়েসে চালিয়ে যেতে চাও, নাকি টাইপ করে?"
  fallback: "দুঃখিত, আমার এখন একটু সমস্যা হচ্ছে। চলো একটু পরে আবার চেষ্টা করি।"
  distress_close: "আমাকে বলার জন্য ধন্যবাদ। আমি এখনই একজন বড়কে ডাকছি যিনি তোমাকে সাহায্য করবেন। আজ তুমি খুব ভালো করেছো।"
  clarification: "আমি ঠিক বুঝতে পারিনি। তুমি কি আবার একবার বলবে?"
  asr_fallback: "চলো এখন টাইপ করি — তুমি তোমার উত্তর টাইপ করে পাঠাতে পারো।"
  unresolved_doubt_escalation: "মনে হচ্ছে আজ এটা একটু কঠিন। আমি একজন বড়কে ডাকছি এটা ভালোভাবে বুঝিয়ে দেওয়ার জন্য। চেষ্টা করার জন্য দারুণ কাজ করেছো!"
  off_turn_nudge: "বুঝেছি — চলো একটু পরে ওটাতে ফিরে আসি। আজকের কাজ কি আমরা চালিয়ে যাবো?"
  reset_confirmation: "হয়ে গেছে! তোমার টেস্ট অগ্রগতি একদম শুরু থেকে রিসেট করা হয়েছে।"
  mode_voice_keywords: ["ভয়েস", "voice", "কথা বলে", "বলে"]
  mode_text_keywords: ["টাইপ", "type", "লিখে"]
  language_name_keywords: ["bengali", "bangla", "বাংলা"]

Tamil:
  greeting_direct: "வணக்கம் {child_name}! இன்று நீ எப்படி உணர்கிறாய் — உற்சாகமாகவா, சரியாகவா, அல்லது சோர்வாகவா?"
  greeting_candidate_confirm: "சூப்பர், வணக்கம் {child_name}! இன்று நீ எப்படி உணர்கிறாய்?"
  readiness_mode_choice: "சூப்பர். நாம் குரலில் பேசலாம், அல்லது எளிதாக இருந்தால் நீ தட்டச்சு செய்யலாம். உனக்கு எது வேண்டும்?"
  mode_choice_reask: "நீ குரலில் தொடர விரும்புகிறாயா, அல்லது தட்டச்சு செய்யவா?"
  fallback: "மன்னிக்கவும், எனக்கு இப்போது கொஞ்சம் சிக்கல் இருக்கிறது. கொஞ்ச நேரத்தில் மீண்டும் முயற்சிப்போம்."
  distress_close: "எனக்குச் சொன்னதற்கு நன்றி. உனக்கு உதவ ஒரு பெரியவரை இப்போதே அழைக்கிறேன். இன்று நீ மிகச் சிறப்பாக செய்தாய்."
  clarification: "எனக்கு தெளிவாகப் புரியவில்லை. நீ மீண்டும் ஒருமுறை சொல்ல முடியுமா?"
  asr_fallback: "இப்போது தட்டச்சுக்கு மாறுவோம் — நீ உன் பதிலை தட்டச்சு செய்து அனுப்பலாம்."
  unresolved_doubt_escalation: "இன்று இது கொஞ்சம் கடினமாக இருக்கிறது போல் தெரிகிறது. இதை சரியாக விளக்க ஒரு பெரியவரை அழைக்கிறேன். முயற்சி செய்ததற்கு பாராட்டுக்கள்!"
  off_turn_nudge: "புரிகிறது — கொஞ்ச நேரத்தில் அதற்குத் திரும்புவோம். இன்றைய செயல்பாட்டைத் தொடரலாமா?"
  reset_confirmation: "முடிந்தது! உன் டெஸ்ட் முன்னேற்றம் முதலிலிருந்து மீட்டமைக்கப்பட்டது."
  mode_voice_keywords: ["குரல்", "voice", "பேசி", "பேசுவது"]
  mode_text_keywords: ["தட்டச்சு", "type", "எழுதி"]
  language_name_keywords: ["tamil", "தமிழ்"]

Telugu:
  greeting_direct: "హాయ్ {child_name}! ఈ రోజు నీకు ఎలా అనిపిస్తోంది — ఉత్సాహంగా, బాగానే, లేదా అలసటగా?"
  greeting_candidate_confirm: "సూపర్, హాయ్ {child_name}! ఈ రోజు నీకు ఎలా అనిపిస్తోంది?"
  readiness_mode_choice: "బాగుంది. మనం వాయిస్‌లో మాట్లాడుకోవచ్చు, లేదా సులభంగా అనిపిస్తే నువ్వు టైప్ చేయవచ్చు. నీకు ఏది కావాలి?"
  mode_choice_reask: "నువ్వు వాయిస్‌లో కొనసాగించాలనుకుంటున్నావా, లేదా టైప్ చేయాలనుకుంటున్నావా?"
  fallback: "క్షమించు, నాకు ఇప్పుడు కొంచెం ఇబ్బంది అవుతోంది. కొద్ది సేపట్లో మళ్ళీ ప్రయత్నిద్దాం."
  distress_close: "నాకు చెప్పినందుకు ధన్యవాదాలు. నీకు సహాయం చేయడానికి నేను ఇప్పుడే ఒక పెద్దవారిని పిలుస్తున్నాను. ఈ రోజు నువ్వు చాలా బాగా చేశావు."
  clarification: "నాకు సరిగ్గా అర్థం కాలేదు. నువ్వు మళ్ళీ ఒకసారి చెప్పగలవా?"
  asr_fallback: "ఇప్పుడు టైపింగ్‌కి మారదాం — నువ్వు నీ జవాబును టైప్ చేసి పంపవచ్చు."
  unresolved_doubt_escalation: "ఈ రోజు ఇది కొంచెం కష్టంగా ఉన్నట్టు అనిపిస్తోంది. దీన్ని సరిగ్గా వివరించడానికి నేను ఒక పెద్దవారిని పిలుస్తున్నాను. ప్రయత్నించినందుకు శభాష్!"
  off_turn_nudge: "అర్థమైంది — కొద్ది సేపట్లో దానికి తిరిగి వద్దాం. ఈ రోజు కార్యకలాపాన్ని కొనసాగిద్దామా?"
  reset_confirmation: "పూర్తయింది! నీ టెస్ట్ పురోగతి మొదటి నుండి రీసెట్ చేయబడింది."
  mode_voice_keywords: ["వాయిస్", "voice", "మాట్లాడి", "మాటల్లో"]
  mode_text_keywords: ["టైప్", "type", "రాసి"]
  language_name_keywords: ["telugu", "తెలుగు"]

Marathi:
  greeting_direct: "नमस्कार {child_name}! आज तुला कसं वाटतंय — उत्साही, ठीक, की दमलेलं?"
  greeting_candidate_confirm: "छान, नमस्कार {child_name}! आज तुला कसं वाटतंय?"
  readiness_mode_choice: "छान. आपण आवाजात बोलू शकतो, किंवा सोपं वाटलं तर तू टाइप करू शकतोस. तुला काय आवडेल?"
  mode_choice_reask: "तुला आवाजात बोलत राहायचंय, की टाइप करून?"
  fallback: "माफ कर, मला आत्ता थोडी अडचण येत आहे. थोड्या वेळाने पुन्हा प्रयत्न करूया."
  distress_close: "मला सांगितल्याबद्दल धन्यवाद. मी आत्ताच एका मोठ्या माणसाला तुझ्या मदतीसाठी बोलावत आहे. आज तू खूप छान केलंस."
  clarification: "मला नीट कळलं नाही. तू परत एकदा सांगशील का?"
  asr_fallback: "आता आपण टायपिंगकडे वळूया — तू तुझं उत्तर टाइप करून पाठवू शकतोस."
  unresolved_doubt_escalation: "आज हे थोडं अवघड वाटतंय. हे नीट समजावण्यासाठी मी एका मोठ्या माणसाला बोलावत आहे. प्रयत्न केल्याबद्दल शाब्बास!"
  off_turn_nudge: "समजलं — थोड्या वेळाने त्यावर परत येऊया. आजचा उपक्रम पुढे सुरू ठेवूया का?"
  reset_confirmation: "झालं! तुझी टेस्ट प्रगती अगदी सुरुवातीपासून रीसेट केली आहे."
  mode_voice_keywords: ["आवाज", "voice", "बोलून"]
  mode_text_keywords: ["टाइप", "type", "लिहून"]
  language_name_keywords: ["marathi", "मराठी"]

Gujarati:
  greeting_direct: "નમસ્તે {child_name}! આજે તને કેવું લાગે છે — ઉત્સાહિત, ઠીક, કે થાકેલું?"
  greeting_candidate_confirm: "સરસ, નમસ્તે {child_name}! આજે તને કેવું લાગે છે?"
  readiness_mode_choice: "સરસ. આપણે અવાજમાં વાત કરી શકીએ, અથવા સહેલું લાગે તો તું ટાઇપ પણ કરી શકે છે. તને શું ગમશે?"
  mode_choice_reask: "તારે અવાજમાં ચાલુ રાખવું છે, કે ટાઇપ કરીને?"
  fallback: "માફ કરજે, મને અત્યારે થોડી તકલીફ થઈ રહી છે. થોડી વારમાં ફરી પ્રયત્ન કરીએ."
  distress_close: "મને કહેવા બદલ આભાર. હું અત્યારે જ એક મોટી વ્યક્તિને તારી મદદ માટે બોલાવી રહ્યો છું. આજે તેં ખૂબ સરસ કર્યું."
  clarification: "મને બરાબર સમજાયું નહીં. તું ફરી એકવાર કહીશ?"
  asr_fallback: "ચાલો હવે ટાઇપિંગ પર જઈએ — તું તારો જવાબ ટાઇપ કરીને મોકલી શકે છે."
