  greeting_candidate_confirm: "ਬਹੁਤ ਵਧੀਆ, ਸਤਿ ਸ੍ਰੀ ਅਕਾਲ {child_name}! ਅੱਜ ਤੈਨੂੰ ਕਿਵੇਂ ਮਹਿਸੂਸ ਹੋ ਰਿਹਾ ਹੈ?"
  readiness_mode_choice: "ਬਹੁਤ ਵਧੀਆ। ਅਸੀਂ ਆਵਾਜ਼ ਵਿੱਚ ਗੱਲ ਕਰ ਸਕਦੇ ਹਾਂ, ਜਾਂ ਜੇ ਸੌਖਾ ਲੱਗੇ ਤਾਂ ਤੂੰ ਟਾਈਪ ਵੀ ਕਰ ਸਕਦਾ ਹੈਂ। ਤੈਨੂੰ ਕੀ ਪਸੰਦ ਹੈ?"
  mode_choice_reask: "ਕੀ ਤੂੰ ਆਵਾਜ਼ ਵਿੱਚ ਜਾਰੀ ਰੱਖਣਾ ਚਾਹੁੰਦਾ ਹੈਂ, ਜਾਂ ਟਾਈਪ ਕਰਕੇ?"
  fallback: "ਮਾਫ਼ ਕਰਨਾ, ਮੈਨੂੰ ਹੁਣੇ ਥੋੜ੍ਹੀ ਦਿੱਕਤ ਆ ਰਹੀ ਹੈ। ਆਓ ਥੋੜ੍ਹੀ ਦੇਰ ਬਾਅਦ ਫਿਰ ਕੋਸ਼ਿਸ਼ ਕਰੀਏ।"
  distress_close: "ਮੈਨੂੰ ਦੱਸਣ ਲਈ ਧੰਨਵਾਦ। ਮੈਂ ਹੁਣੇ ਹੀ ਇੱਕ ਵੱਡੇ ਵਿਅਕਤੀ ਨੂੰ ਤੇਰੀ ਮਦਦ ਲਈ ਬੁਲਾ ਰਿਹਾ ਹਾਂ। ਅੱਜ ਤੂੰ ਬਹੁਤ ਵਧੀਆ ਕੀਤਾ।"
  clarification: "ਮੈਨੂੰ ਠੀਕ ਤਰ੍ਹਾਂ ਸਮਝ ਨਹੀਂ ਆਇਆ। ਕੀ ਤੂੰ ਇੱਕ ਵਾਰ ਫਿਰ ਦੱਸ ਸਕਦਾ ਹੈਂ?"
