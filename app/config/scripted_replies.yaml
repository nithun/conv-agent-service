Kannada:
  greeting_direct: "ಹಾಯ್ {child_name}! ಇಂದು ನಿನಗೆ ಹೇಗನಿಸುತ್ತಿದೆ — ಉತ್ಸಾಹದಿಂದ, ಚೆನ್ನಾಗಿ, ಅಥವಾ ದಣಿವಾಗಿದೆಯಾ?"
  greeting_candidate_confirm: "ಸೂಪರ್, ಹಾಯ್ {child_name}! ಇಂದು ನಿನಗೆ ಹೇಗನಿಸುತ್ತಿದೆ?"
  readiness_mode_choice: "ಚೆನ್ನಾಗಿದೆ. ನಾವು ಧ್ವನಿಯಲ್ಲಿ ಮಾತನಾಡಬಹುದು, ಅಥವಾ ಸುಲಭ ಎನಿಸಿದರೆ ನೀನು ಟೈಪ್ ಮಾಡಬಹುದು. ನಿನಗೆ ಯಾವುದು ಇಷ್ಟ?"
  mode_choice_reask: "ನೀನು ಧ್ವನಿಯಲ್ಲಿ ಮುಂದುವರಿಸಲು ಬಯಸುವೆಯಾ, ಅಥವಾ ಟೈಪ್ ಮಾಡಿಯಾ?"
  fallback: "ಕ್ಷಮಿಸು, ನನಗೆ ಈಗ ಸ್ವಲ್ಪ ತೊಂದರೆಯಾಗುತ್ತಿದೆ. ಸ್ವಲ್ಪ ಸಮಯದಲ್ಲಿ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸೋಣ."
  distress_close: "ನನಗೆ ಹೇಳಿದ್ದಕ್ಕೆ ಧನ್ಯವಾದಗಳು. ನಿನಗೆ ಸಹಾಯ ಮಾಡಲು ನಾನು ಈಗಲೇ ಒಬ್ಬ ದೊಡ್ಡವರನ್ನು ಕರೆಯುತ್ತಿದ್ದೇನೆ. ಇಂದು ನೀನು ತುಂಬಾ ಚೆನ್ನಾಗಿ ಮಾಡಿದೆ."
  clarification: "ನನಗೆ ಸರಿಯಾಗಿ ಅರ್ಥವಾಗಲಿಲ್ಲ. ನೀನು ಮತ್ತೊಮ್ಮೆ ಹೇಳುವೆಯಾ?"
  asr_fallback: "ಈಗ ಟೈಪಿಂಗ್‌ಗೆ ಬದಲಾಗೋಣ — ನೀನು ನಿನ್ನ ಉತ್ತರವನ್ನು ಟೈಪ್ ಮಾಡಿ ಕಳುಹಿಸಬಹುದು."
  unresolved_doubt_escalation: "ಇಂದು ಇದು ಸ್ವಲ್ಪ ಕಷ್ಟ ಎನಿಸುತ್ತಿದೆ. ಇದನ್ನು ಸರಿಯಾಗಿ ವಿವರಿಸಲು ನಾನು ಒಬ್ಬ ದೊಡ್ಡವರನ್ನು ಕರೆಯುತ್ತಿದ್ದೇನೆ. ಪ್ರಯತ್ನಿಸಿದ್ದಕ್ಕೆ ಶಹಬ್ಬಾಸ್!"
  off_turn_nudge: "ಅರ್ಥವಾಯಿತು — ಸ್ವಲ್ಪ ಸಮಯದಲ್ಲಿ ಅದಕ್ಕೆ ಹಿಂತಿರುಗೋಣ. ಇಂದಿನ ಚಟುವಟಿಕೆಯನ್ನು ಮುಂದುವರಿಸೋಣವೇ?"
  reset_confirmation: "ಮುಗಿಯಿತು! ನಿನ್ನ ಟೆಸ್ಟ್ ಪ್ರಗತಿಯನ್ನು ಮೊದಲಿನಿಂದ ಮರುಹೊಂದಿಸಲಾಗಿದೆ."
