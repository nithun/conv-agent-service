  greeting_direct: "ہیلو {child_name}! آج تمہیں کیسا محسوس ہو رہا ہے — پرجوش، ٹھیک، یا تھکا ہوا؟"
  greeting_candidate_confirm: "بہت خوب، ہیلو {child_name}! آج تمہیں کیسا محسوس ہو رہا ہے؟"
  readiness_mode_choice: "بہت اچھا۔ ہم آواز میں بات کر سکتے ہیں، یا اگر آسان لگے تو تم ٹائپ بھی کر سکتے ہو۔ تمہیں کیا پسند ہے؟"
  mode_choice_reask: "کیا تم آواز میں جاری رکھنا چاہتے ہو، یا ٹائپ کر کے؟"
  fallback: "معاف کرنا، مجھے ابھی تھوڑی مشکل ہو رہی ہے۔ چلو تھوڑی دیر میں دوبارہ کوشش کرتے ہیں۔"
  distress_close: "مجھے بتانے کا شکریہ۔ میں ابھی ایک بڑے کو تمہاری مدد کے لیے بلا رہا ہوں۔ آج تم نے بہت اچھا کیا۔"
  clarification: "مجھے ٹھیک سے سمجھ نہیں آیا۔ کیا تم ایک بار پھر بتاؤ گے؟"
  asr_fallback: "چلو اب ٹائپنگ کی طرف چلتے ہیں — تم اپنا جواب ٹائپ کر کے بھیج سکتے ہو۔"
  unresolved_doubt_escalation: "لگتا ہے آج یہ تھوڑا مشکل ہے۔ میں اسے ٹھیک طرح سمجھانے کے لیے ایک بڑے کو بلا رہا ہوں۔ کوشش کرنے کے لیے شاباش!"
  off_turn_nudge: "سمجھ گیا — چلو تھوڑی دیر میں اس کی طرف واپس آتے ہیں۔ کیا ہم آج کی سرگرمی جاری رکھیں؟"
  reset_confirmation: "ہو گیا! تمہاری ٹیسٹ پیش رفت شروع سے دوبارہ ترتیب دے دی گئی ہے۔"
