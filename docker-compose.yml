# Local dev: FastAPI service + standalone worker process + Redis as sibling
# services (Docker-first extension, docs/architecture.md Sec5 in the parent
# workspace). Supersedes bare-metal `uvicorn` + separately provisioned Redis
# for local dev.
#
# BOTH `app` and `worker` must be running for the service to function:
# `app` only fast-acks the Glific webhook and enqueues (L-002); `worker` is
# what actually processes turns (LLM/Frappe calls, guardrails) AND drains
# the escalation stream (distress-hit Glific send + Ticket-open, CR-004
# Phase 7 gap-close). Without `worker`, every turn reply and every distress
# escalation is silently dropped even though ingress returns 200 OK.

services:
  app:
    build:
      context: .
      target: dev
    ports:
      # Host 8001 (container 8000): tap-buddy — still the live Glific
      # webhook target until F-019's cutover — holds host 8000, and both
      # services must run side by side through the transition window.
      # glific-platform's CR-001 must point the flow webhook at THIS
      # service's published port (8001) when it executes the re-point.
      - "8001:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./app:/srv/app
      - ./tests:/srv/tests
      # Shared TTS media dir (CR-007): the WORKER synthesizes and writes
      # audio files here; the APP's /media/{token} route serves them to the
      # BSP. Without one shared mount the file lands in the worker's
      # container-local filesystem and every public media fetch 404s
      # (caught live 2026-07-17 during CR-007's pre-phone-test smoke).
      - ./data/media:/srv/data/media

  worker:
    build:
      context: .
      target: dev
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      # Google STT/TTS credential wiring (BR-004 Task 1): reuses the SAME
      # GCP_SA_KEY_PATH .env variable the litellm service already mounts
      # below — no second key-path variable invented. Empty/unset
      # GCP_SA_KEY_PATH resolves this to an empty string (via compose's
      # ${VAR:+alt} interpolation, verified with `docker compose config`),
      # which is exactly `Settings.google_application_credentials`'s empty
      # default — `app/worker/main.py::_build_speech_client` gates
      # SpeechClient() construction on that field being non-empty, so an
      # unset key never even attempts to construct a client with this
      # (harmless, placeholder) env value. Voice turns degrade gracefully
      # (no speech client -> text-only turns, ASR-failure/TTS call sites
      # simply skip) rather than crashing worker startup via
      # DefaultCredentialsError.
      GOOGLE_APPLICATION_CREDENTIALS: ${GCP_SA_KEY_PATH:+/secrets/gcp-sa.json}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./app:/srv/app
      - ./tests:/srv/tests
      # Read-only SA key mount, only meaningful once GOOGLE_APPLICATION_CREDENTIALS
      # (above) is non-empty. Falls back to /dev/null when GCP_SA_KEY_PATH is
      # unset so `docker compose up` never fails static validation on a
      # fresh dev box / CI with no GCP secret provisioned yet (unlike
      # litellm's `:?set in .env` mount below, which intentionally hard-fails
      # since litellm's whole purpose requires the key).
      - ${GCP_SA_KEY_PATH:-/dev/null}:/secrets/gcp-sa.json:ro
      # Shared TTS media dir (CR-007) — see the app service's same mount.
      - ./data/media:/srv/data/media
    command: ["python", "-m", "app.worker.main"]

  redis:
    image: redis:7-alpine
    # No host port published HERE on purpose (F-044 / ADR-012 BC-2): app and
    # worker reach this over the compose network by service name
    # (REDIS_URL=redis://redis:6379), so a host publish is only for a
    # human's own debugging convenience. `docker-compose.override.yml`
    # (tracked, loopback-only) is the SOLE source of any host publish for
    # this service — publishing nothing here means a deploy that somehow
    # runs without the override fails CLOSED (unreachable from the host)
    # instead of failing open on 0.0.0.0, which is what BC-2 found.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Self-hosted Langfuse (v2, matching pyproject's pinned v2 SDK) so local
  # dev produces REAL traces without a cloud signup — closes the Langfuse
  # half of F-020 (parent workspace docs/open-followups.md). Two services,
  # NOT baked into the app image: Langfuse is a Node/Next.js app with its
  # own Postgres; it runs beside app/worker on the compose network. The SDK
  # in app/worker reaches it by service name: LANGFUSE_HOST=http://langfuse:3000
  # (set in .env). Dashboard published on host port 3001 (3000 is occupied
  # on this machine), loopback-only via docker-compose.override.yml (F-044 /
  # ADR-012 BC-2 — see this service's `ports:` comment below); NEXTAUTH_URL
  # must match the browser-facing URL.
  # Secrets (LANGFUSE_DB_PASSWORD / _NEXTAUTH_SECRET / _SALT) are
  # compose-interpolated from .env — local-only, gitignored, never defaults.
  langfuse-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:?set in .env}
      POSTGRES_DB: langfuse
    # No host port on purpose: only the langfuse service talks to it, over
    # the compose-internal network (avoids clashing with Glific's own
    # host Postgres on 5432).
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 2s
      timeout: 2s
      retries: 20

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    # No host port published HERE on purpose (F-044 / ADR-012 BC-2): app and
    # worker reach this over the compose network (LANGFUSE_HOST=http://langfuse:3000).
    # `docker-compose.override.yml` (tracked, loopback-only) is the SOLE
    # source of any host publish — see the redis service's comment above for
    # why (fail-closed-by-default instead of fail-open-on-0.0.0.0).
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?set in .env}@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set in .env}
      SALT: ${LANGFUSE_SALT:?set in .env}
      TELEMETRY_ENABLED: "false"
      # Headless init (v2.69+): provisions the org/project/user + API keys
      # on first boot so no manual UI signup is needed. The project keys are
      # the SAME values app/worker read as LANGFUSE_PUBLIC_KEY/SECRET_KEY —
      # one source of truth in .env. Idempotent: ignored once objects exist.
      LANGFUSE_INIT_ORG_ID: tap-agent
      LANGFUSE_INIT_ORG_NAME: TAP Agent (local)
      LANGFUSE_INIT_PROJECT_ID: tap-agent-service-local
      LANGFUSE_INIT_PROJECT_NAME: tap-agent-service (local dev)
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?set in .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?set in .env}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?set in .env}
      LANGFUSE_INIT_USER_NAME: Nithun
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?set in .env}

  # Self-hosted LiteLLM proxy (open source) — CR-012 (2026-07-28): this is
  # the REAL, DOCUMENTED PRODUCTION LLM transport for `tap_buddy_turn`, in
  # both local dev and the AD-004 GCP VM deployment — not a "local dev
  # only" stopgap (that framing was already falsified by AD-004 and
  # corrected 2026-07-22 per F-046(b)/L-013; CR-012 makes the promotion
  # explicit and removes every remaining stopgap/dev-only label in this
  # repo). An OpenAI-compatible gateway fronting Vertex AI with the
  # operator's `tap-buddy-mvp` GCP service account, serving
  # `vertex_ai/gemini-2.5-flash` (see litellm.config.yaml's model aliasing,
  # AC-2). The app opts in via .env — this IS the intended production
  # configuration, not an undocumented override:
  #   OPENROUTER_BASE_URL=http://litellm:4000  (empty = real OpenRouter cloud)
  #   OPENROUTER_API_KEY=<LITELLM_MASTER_KEY value>  (client auth to the proxy)
  # ("openrouter" here names the OpenAI-compatible ADAPTER, not the vendor
  # actually serving the call — see app/config/settings.py's
  # openrouter_base_url docstring and app/llm/providers/openrouter.py's
  # module docstring, CR-012 AC-3.)
  # GCP key is mounted read-only from the host path in .env — the file
  # never enters an image or this repo. Model aliasing: litellm.config.yaml.
  # Host port 4001 (4000 on the host is Glific) is for humans/debugging
  # only, and is published loopback-only via docker-compose.override.yml
  # (F-044 / ADR-012 BC-2) — see this service's `ports:` comment below.
  #
  # F-078 (architecture-reviewer ratification of CR-012, 2026-07-28): this
  # is now a child-facing critical-path service with no `FallbackRoute`
  # dispatch behind it (CR-012 explicitly drops that wiring) — a `litellm`
  # outage fails every turn. `restart: unless-stopped` recovers it after a
  # crash/host reboot; the healthcheck (LiteLLM's own unauthenticated
  # `/health/liveliness` probe — `/health` needs the master key and does a
  # deeper per-model check, deliberately not used here) lets
  # `docker compose ps` / a future orchestrator surface an unhealthy proxy
  # instead of silently accepting connections that will fail. No `curl`/
  # `wget` in this image (grep-verified 2026-07-28), hence the python3 CMD.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
      - ${GCP_SA_KEY_PATH:?set in .env}:/secrets/gcp-sa.json:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    # No host port published HERE on purpose (F-044 / ADR-012 BC-2): app and
    # worker reach this over the compose network (OPENROUTER_BASE_URL=http://litellm:4000).
    # `docker-compose.override.yml` (tracked, loopback-only) is the SOLE
    # source of any host publish — see the redis service's comment above for
    # why (fail-closed-by-default instead of fail-open-on-0.0.0.0). This is
    # doubly important here: LITELLM_MASTER_KEY is the credential guarding a
    # billed Vertex AI proxy (F-078 makes it critical-path, no fallback).
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  langfuse-db-data:
