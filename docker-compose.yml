# Local dev: FastAPI service + Redis as sibling services (Docker-first
# extension, docs/architecture.md Sec5 in the parent workspace). Supersedes
# bare-metal `uvicorn` + separately provisioned Redis for local dev.

services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./app:/srv/app
      - ./tests:/srv/tests

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
