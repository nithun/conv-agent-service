# Local dev: FastAPI service + standalone worker process + Redis as sibling
# services (Docker-first extension, docs/architecture.md Sec5 in the parent
# workspace). Supersedes bare-metal `uvicorn` + separately provisioned Redis
# for local dev.
#
# BOTH `app` and `worker` must be running for the service to function:
# `app` only fast-acks the Glific webhook and enqueues (L-002); `worker` is
# what actually processes turns (LLM/Frappe calls, guardrails) AND drains
# the escalation stream (distress-hit Glific send + Ticket-open, CR-004
# Phase 7 gap-close). Without `worker`, every turn reply and every distress
# escalation is silently dropped even though ingress returns 200 OK.

services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./app:/srv/app
      - ./tests:/srv/tests

  worker:
    build:
      context: .
      target: dev
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./app:/srv/app
      - ./tests:/srv/tests
    command: ["python", "-m", "app.worker.main"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Self-hosted Langfuse (v2, matching pyproject's pinned v2 SDK) so local
  # dev produces REAL traces without a cloud signup — closes the Langfuse
  # half of F-020 (parent workspace docs/open-followups.md). Two services,
  # NOT baked into the app image: Langfuse is a Node/Next.js app with its
  # own Postgres; it runs beside app/worker on the compose network. The SDK
  # in app/worker reaches it by service name: LANGFUSE_HOST=http://langfuse:3000
  # (set in .env). Dashboard published on host port 3001 (3000 is occupied
  # on this machine); NEXTAUTH_URL must match the browser-facing URL.
  # Secrets (LANGFUSE_DB_PASSWORD / _NEXTAUTH_SECRET / _SALT) are
  # compose-interpolated from .env — local-only, gitignored, never defaults.
  langfuse-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:?set in .env}
      POSTGRES_DB: langfuse
    # No host port on purpose: only the langfuse service talks to it, over
    # the compose-internal network (avoids clashing with Glific's own
    # host Postgres on 5432).
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 2s
      timeout: 2s
      retries: 20

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?set in .env}@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set in .env}
      SALT: ${LANGFUSE_SALT:?set in .env}
      TELEMETRY_ENABLED: "false"
      # Headless init (v2.69+): provisions the org/project/user + API keys
      # on first boot so no manual UI signup is needed. The project keys are
      # the SAME values app/worker read as LANGFUSE_PUBLIC_KEY/SECRET_KEY —
      # one source of truth in .env. Idempotent: ignored once objects exist.
      LANGFUSE_INIT_ORG_ID: tap-agent
      LANGFUSE_INIT_ORG_NAME: TAP Agent (local)
      LANGFUSE_INIT_PROJECT_ID: tap-agent-service-local
      LANGFUSE_INIT_PROJECT_NAME: tap-agent-service (local dev)
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?set in .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?set in .env}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?set in .env}
      LANGFUSE_INIT_USER_NAME: Nithun
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?set in .env}

  # Self-hosted LiteLLM proxy (open source) — LOCAL DEV ONLY (F-020). An
  # OpenAI-compatible gateway fronting Vertex AI with the operator's
  # existing GCP service account, so a REAL model call can run + be traced
  # without an OpenRouter account. The app opts in via .env:
  #   OPENROUTER_BASE_URL=http://litellm:4000  (empty = real OpenRouter)
  #   OPENROUTER_API_KEY=<LITELLM_MASTER_KEY value>  (client auth to the proxy)
  # GCP key is mounted read-only from the host path in .env — the file
  # never enters an image or this repo. Model aliasing: litellm.config.yaml.
  # Host port 4001 is for humans/debugging only (4000 on the host is Glific).
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
      - ${GCP_SA_KEY_PATH:?set in .env}:/secrets/gcp-sa.json:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4001:4000"

volumes:
  langfuse-db-data:
